<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SalariGram</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0a0c;
  --bg2:#111114;
  --panel:#16161a;
  --panel2:#1c1c22;
  --border:#2a2a32;
  --text:#f2f2f5;
  --muted:#8a8a96;
  --accent:#e11d48;
  --accent2:#be123c;
  --accent-soft:rgba(225,29,72,.12);
  --success:#22c55e;
  --danger:#ef4444;
  --gold:#f59e0b;
  --radius:16px;
  --radius-sm:12px;
  --shadow:0 8px 32px rgba(0,0,0,.45);
}
html,body{height:100%;font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.5}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;transition:.2s}
.hidden{display:none!important}

/* LAYOUT */
.app{display:flex;height:100vh;height:100dvh;max-width:1400px;margin:0 auto;background:var(--bg2);box-shadow:var(--shadow)}
.sidebar{width:320px;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0}
.main{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg)}
.side{width:300px;background:var(--panel);border-left:1px solid var(--border);overflow:auto;padding:20px;flex-shrink:0}

/* BRAND */
.brand{padding:20px;display:flex;align-items:center;gap:12px;font-weight:900;font-size:20px;letter-spacing:-.4px}
.logo{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,var(--accent),#9f1239);display:grid;place-items:center;font-size:20px;box-shadow:0 4px 20px rgba(225,29,72,.4)}

/* PROFILE MINI */
.profile-mini{margin:0 14px 14px;padding:12px;border-radius:var(--radius);background:var(--panel2);border:1px solid var(--border);display:flex;align-items:center;gap:12px}
.avatar{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#3f0a15,#1a0a0f);display:grid;place-items:center;overflow:hidden;flex-shrink:0;font-size:18px}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar.lg{width:88px;height:88px;font-size:32px}
.avatar.sm{width:36px;height:36px;font-size:14px}
.avatar.xs{width:30px;height:30px;font-size:12px}
.user-info{min-width:0;flex:1}
.user-name{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-sub{font-size:12px;color:var(--muted)}

/* NAV */
.nav{padding:0 10px;display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;color:var(--muted);font-weight:600;font-size:14px;text-align:left}
.nav button:hover{background:var(--accent-soft);color:var(--accent)}
.nav button.active{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 4px 16px rgba(225,29,72,.35)}
.nav .dev-btn{color:#f472b6;margin-top:6px}
.nav .dev-btn.active,.nav .dev-btn:hover{background:linear-gradient(135deg,#be185d,#9d174d);color:#fff}

/* SEARCH */
.search{padding:12px 14px}
.search input{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--border);background:var(--panel2);outline:none;font-size:13px}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

/* CHAT LIST */
.chat-list{flex:1;overflow:auto;padding:4px 10px 16px}
.chat-item{display:flex;gap:12px;padding:11px;border-radius:14px;cursor:pointer;align-items:center;transition:.15s}
.chat-item:hover{background:var(--panel2)}
.chat-item.active{background:var(--accent-soft);border:1px solid rgba(225,29,72,.25)}
.chat-preview{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.chat-time{font-size:11px;color:var(--muted)}

/* TOPBAR */
.topbar{height:68px;padding:0 18px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--border);background:rgba(22,22,26,.85);backdrop-filter:blur(12px)}
.top-user{flex:1;display:flex;align-items:center;gap:12px;min-width:0}
.icon-btn{width:40px;height:40px;border-radius:12px;background:var(--panel2);border:1px solid var(--border);display:grid;place-items:center;font-size:16px}
.icon-btn:hover{background:var(--accent-soft);border-color:rgba(225,29,72,.3);color:var(--accent)}

/* MESSAGES */
.messages{flex:1;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:10px}
.msg{display:flex;gap:8px;align-items:flex-end;max-width:75%}
.msg.mine{align-self:flex-end;flex-direction:row-reverse}
.bubble{padding:11px 15px;border-radius:18px;background:var(--panel2);border:1px solid var(--border);position:relative}
.msg.mine .bubble{background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;color:#fff;border-bottom-right-radius:6px}
.msg:not(.mine) .bubble{border-bottom-left-radius:6px}
.msg-text{font-size:14.5px;white-space:pre-wrap;word-break:break-word}
.msg-meta{font-size:11px;color:var(--muted);margin-top:4px;display:flex;justify-content:flex-end;gap:4px}
.msg.mine .msg-meta{color:rgba(255,255,255,.7)}
.reply-quote{padding:6px 10px;margin-bottom:6px;border-left:3px solid var(--accent);background:rgba(0,0,0,.2);border-radius:8px;font-size:12px;color:var(--muted)}
.msg.mine .reply-quote{border-left-color:#fda4af;background:rgba(255,255,255,.1);color:rgba(255,255,255,.8)}
.reactions{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
.reaction{padding:3px 8px;border-radius:20px;background:var(--panel);border:1px solid var(--border);font-size:12px;cursor:pointer}
.reaction:hover{background:var(--accent-soft)}
.msg-actions{display:flex;gap:6px;margin-top:4px;opacity:0;transition:.15s}
.msg:hover .msg-actions{opacity:1}
.msg-actions button{font-size:12px;color:var(--muted);padding:2px 4px}
.msg-actions button:hover{color:var(--accent)}

/* COMPOSER */
.composer{padding:14px 16px;border-top:1px solid var(--border);background:var(--panel)}
.reply-bar{display:none;padding:8px 12px;background:var(--panel2);border-radius:10px;margin-bottom:10px;font-size:13px;border:1px solid var(--border)}
.composer-row{display:flex;gap:8px;align-items:flex-end}
.composer textarea{flex:1;min-height:44px;max-height:120px;resize:none;padding:12px 14px;border-radius:14px;border:1px solid var(--border);background:var(--panel2);outline:none;font-size:14px}
.composer textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.send-btn{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-size:18px;box-shadow:0 4px 16px rgba(225,29,72,.35)}
.send-btn:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(225,29,72,.45)}

/* SIDE PANEL */
.side-title{font-size:18px;font-weight:800;margin-bottom:16px}
.card{background:var(--panel2);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 16px;border-radius:12px;font-weight:700;font-size:13px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 4px 14px rgba(225,29,72,.3)}
.btn:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(225,29,72,.4)}
.btn.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--border);box-shadow:none}
.btn.secondary:hover{background:var(--accent-soft);border-color:rgba(225,29,72,.3);color:var(--accent)}
.btn.danger{background:rgba(239,68,68,.15);color:#f87171;border:1px solid rgba(239,68,68,.3);box-shadow:none}
.btn.full{width:100%}
.btn.sm{padding:8px 12px;font-size:12px}

/* STATS */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--panel2);border:1px solid var(--border);border-radius:12px;padding:12px 8px;text-align:center}
.stat b{display:block;font-size:18px;font-weight:800}
.stat span{font-size:11px;color:var(--muted)}
.progress{height:6px;background:var(--border);border-radius:10px;overflow:hidden;margin-top:8px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#fb7185);border-radius:10px}

/* GIFTS */
.gift-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.gift{background:var(--panel2);border:1px solid var(--border);border-radius:14px;padding:12px 6px;text-align:center;cursor:pointer;transition:.2s}
.gift:hover{transform:translateY(-3px);border-color:rgba(225,29,72,.4);box-shadow:0 8px 24px rgba(225,29,72,.15)}
.gift-icon{font-size:28px}
.gift-name{font-size:11px;font-weight:700;margin-top:4px}
.gift-price{font-size:11px;color:var(--gold);margin-top:2px;font-weight:600}
.rarity{display:inline-block;font-size:9px;padding:2px 6px;border-radius:8px;margin-top:4px;font-weight:700}
.rarity.common{background:#27272a;color:#a1a1aa}
.rarity.rare{background:#1e3a5f;color:#60a5fa}
.rarity.epic{background:#3b1a5c;color:#c084fc}
.rarity.legendary{background:#422006;color:#fbbf24}
.rarity.mythic{background:#4a044e;color:#f0abfc}
.rarity.ultra{background:#052e16;color:#4ade80}

/* MODAL */
.modal-back{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(8px);display:grid;place-items:center;padding:16px;z-index:50}
.modal{width:min(520px,100%);max-height:90vh;overflow:auto;background:var(--panel);border-radius:24px;padding:24px;border:1px solid var(--border);box-shadow:0 24px 64px rgba(0,0,0,.5)}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.modal-title{font-size:20px;font-weight:800}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:11px;font-weight:700;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.3px}
.form-input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--border);background:var(--panel2);outline:none;font-size:14px}
.form-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.tabs{display:flex;gap:6px;margin-bottom:14px;overflow:auto}
.tab{padding:8px 14px;border-radius:10px;font-size:13px;font-weight:600;color:var(--muted);background:var(--panel2);white-space:nowrap}
.tab.active{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}

/* BADGES */
.role-badge{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:10px;font-size:11px;font-weight:700}
.role-user{background:#27272a;color:#a1a1aa}
.role-junior{background:#14532d;color:#4ade80}
.role-moder{background:#1e3a5f;color:#60a5fa}
.role-gl{background:#164e63;color:#22d3ee}
.role-admin{background:#422006;color:#fbbf24}
.role-creator{background:#4a044e;color:#f0abfc}
.role-sponsor{background:#831843;color:#f9a8d4}
.badge{display:inline-block;padding:4px 8px;border-radius:8px;background:var(--panel2);font-size:11px;font-weight:600;margin:2px}

/* TOAST */
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:#1c1c22;color:#fff;padding:12px 20px;border-radius:14px;opacity:0;pointer-events:none;transition:.3s;z-index:100;font-weight:600;border:1px solid var(--border);box-shadow:0 8px 32px rgba(0,0,0,.4)}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* LIST */
.list-item{padding:12px;border-radius:12px;background:var(--panel2);border:1px solid var(--border);margin-bottom:8px}
.list-item:hover{border-color:rgba(225,29,72,.3)}

/* AUTH */
.auth-box{text-align:center;margin-bottom:20px}
.auth-box .logo{margin:0 auto 12px;width:56px;height:56px;font-size:26px}
.auth-box h1{font-size:26px;font-weight:900;letter-spacing:-.5px}
.auth-box p{color:var(--muted);font-size:13px;margin-top:4px}

/* QUEST */
.quest{display:flex;gap:12px;align-items:center}
.quest-icon{width:40px;height:40px;border-radius:12px;background:var(--accent-soft);display:grid;place-items:center;font-size:18px}

/* TYPING */
.typing{height:16px;font-size:12px;color:var(--muted);padding:0 8px;font-weight:500}

/* ANIMATIONS */
.gift-anim{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;z-index:80;font-size:100px;animation:pop 1.5s ease forwards}
@keyframes pop{0%{transform:scale(.2) rotate(-15deg);opacity:0}30%{transform:scale(1.2);opacity:1}100%{transform:translateY(-120px) scale(.4);opacity:0}}
.confetti{position:fixed;width:8px;height:12px;top:-20px;z-index:90;animation:fall 1.8s linear forwards;border-radius:2px}
@keyframes fall{to{transform:translateY(100vh) rotate(720deg);opacity:0}}

/* FRAMES */
.frame-gold{box-shadow:0 0 0 3px #f59e0b,0 0 12px rgba(245,158,11,.4)}
.frame-neon{box-shadow:0 0 0 3px #e11d48,0 0 16px rgba(225,29,72,.5)}
.frame-space{box-shadow:0 0 0 3px #6366f1,0 0 12px rgba(99,102,241,.4)}

/* MOBILE */
.mobile-menu{display:none}
@media(max-width:1100px){.side{display:none}}
@media(max-width:780px){
  .sidebar{position:fixed;left:-100%;top:0;bottom:0;z-index:40;transition:.3s;width:280px;box-shadow:var(--shadow)}
  .sidebar.open{left:0}
  .mobile-menu{display:grid}
  .msg{max-width:88%}
  .gift-grid{grid-template-columns:repeat(3,1fr)}
}
@media(max-width:420px){.gift-grid{grid-template-columns:repeat(2,1fr)}}

/* ===== 2026 UPGRADE ===== */
:root{--glass:rgba(24,24,30,.62);--g1:#e11d48;--g2:#7c3aed;--g3:#06b6d4}
body{background:radial-gradient(1200px 600px at 10% -10%,rgba(225,29,72,.18),transparent 60%),radial-gradient(900px 600px at 100% 110%,rgba(124,58,237,.18),transparent 60%),#07070a}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 30% 30%,rgba(6,182,212,.08),transparent 40%);animation:drift 18s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(6%,4%) scale(1.15)}}
.app{background:transparent;border-radius:0;box-shadow:0 0 0 1px rgba(255,255,255,.04),0 30px 90px rgba(0,0,0,.6)}
@media(min-width:1000px){.app{height:calc(100dvh - 24px);margin-top:12px;border-radius:26px;overflow:hidden}}
.sidebar,.side,.topbar,.composer{background:var(--glass)!important;backdrop-filter:blur(22px) saturate(1.5)}
.main{background:linear-gradient(180deg,rgba(10,10,12,.55),rgba(10,10,12,.85)),repeating-linear-gradient(45deg,rgba(255,255,255,.012) 0 14px,transparent 14px 28px)}
.logo{background:conic-gradient(from 200deg,var(--g1),var(--g2),var(--g3),var(--g1));animation:spin 12s linear infinite;box-shadow:0 0 28px rgba(225,29,72,.55)}
@keyframes spin{to{filter:hue-rotate(360deg)}}
.brand{background:linear-gradient(90deg,#fff,#fda4af,#c4b5fd);-webkit-background-clip:text;background-clip:text}
.brand .logo{-webkit-text-fill-color:initial}
.avatar{box-shadow:0 0 0 2px var(--bg2),0 0 0 4px rgba(225,29,72,.55);background:linear-gradient(135deg,var(--g1),var(--g2))}
.chat-item{border:1px solid transparent}
.chat-item:hover{transform:translateX(3px);background:rgba(255,255,255,.05)}
.chat-item.active{background:linear-gradient(135deg,rgba(225,29,72,.22),rgba(124,58,237,.14));box-shadow:0 6px 24px rgba(225,29,72,.15)}
.msg{animation:pop .28s cubic-bezier(.2,1.3,.4,1)}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.94)}}
.bubble{backdrop-filter:blur(8px);box-shadow:0 2px 12px rgba(0,0,0,.25)}
.msg.mine .bubble{background:linear-gradient(135deg,#f43f5e,#be123c 55%,#7c3aed);box-shadow:0 6px 22px rgba(225,29,72,.35)}
.nav button.active{background:linear-gradient(135deg,var(--g1),var(--g2));box-shadow:0 6px 22px rgba(124,58,237,.4)}
.btn{background:linear-gradient(135deg,var(--g1),var(--g2))}
.card{background:linear-gradient(160deg,rgba(255,255,255,.05),rgba(255,255,255,.015));backdrop-filter:blur(10px);transition:.25s}
.card:hover{border-color:rgba(225,29,72,.3)}
.stat{background:linear-gradient(160deg,rgba(255,255,255,.06),rgba(255,255,255,.01));transition:.2s}
.stat:hover{transform:translateY(-3px);border-color:var(--g1)}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:9px}
/* dev dashboard */
.dv-hero{position:relative;overflow:hidden;border-radius:20px;padding:18px;margin-bottom:12px;background:linear-gradient(135deg,#e11d48,#7c3aed 60%,#06b6d4);box-shadow:0 12px 40px rgba(124,58,237,.35)}
.dv-hero:after{content:"";position:absolute;width:180px;height:180px;right:-50px;top:-60px;border-radius:50%;background:rgba(255,255,255,.18);filter:blur(6px)}
.dv-hero h3{font-size:18px;font-weight:900}.dv-hero small{opacity:.85}
.dv-live{display:inline-flex;gap:6px;align-items:center;font-size:11px;font-weight:700;background:rgba(0,0,0,.28);padding:4px 10px;border-radius:20px;margin-top:8px}
.dv-live i{width:8px;height:8px;border-radius:50%;background:#4ade80;animation:pulse 1.4s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 7px rgba(74,222,128,0)}0%{box-shadow:0 0 0 0 rgba(74,222,128,.7)}}
.dv-kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.dv-kpi{padding:12px;border-radius:16px;border:1px solid var(--border);background:var(--panel2);position:relative;overflow:hidden}
.dv-kpi b{font-size:22px;font-weight:900;display:block}.dv-kpi span{font-size:11px;color:var(--muted)}
.dv-kpi:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c)}
.dv-bars{display:flex;align-items:flex-end;gap:6px;height:96px;margin-top:10px}
.dv-bars div{flex:1;border-radius:8px 8px 3px 3px;background:linear-gradient(180deg,var(--g1),var(--g2));min-height:4px;position:relative;animation:grow .7s ease both;transform-origin:bottom}
.dv-bars div em{position:absolute;top:-16px;left:0;right:0;text-align:center;font:600 10px Inter;color:var(--muted)}
@keyframes grow{from{transform:scaleY(0)}}
.dv-days{display:flex;gap:6px;font-size:10px;color:var(--muted);margin-top:4px}.dv-days span{flex:1;text-align:center}
.dv-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px}
.dv-row:last-child{border:0}.dv-row .n{flex:1;font-weight:600}.dv-row .v{color:var(--gold);font-weight:800}
.dv-meter{height:8px;border-radius:9px;background:rgba(255,255,255,.07);overflow:hidden;margin-top:6px}
.dv-meter i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--g3),var(--g2),var(--g1))}

/* ===== FUN PACK ===== */
#fx{position:fixed;inset:0;z-index:0;pointer-events:none}
.app{position:relative;z-index:1}
#confetti{position:fixed;inset:0;z-index:999;pointer-events:none}
.msg-text.big{font-size:64px;line-height:1.1;animation:wob 1.6s ease-in-out infinite}
.bubble:has(.big){background:none!important;border:0!important;box-shadow:none!important;backdrop-filter:none}
@keyframes wob{0%,100%{transform:rotate(-6deg) scale(1)}50%{transform:rotate(6deg) scale(1.12)}}
.fab{position:fixed;right:18px;bottom:18px;z-index:50;width:52px;height:52px;border-radius:50%;font-size:22px;background:linear-gradient(135deg,var(--g1),var(--g2));box-shadow:0 8px 30px rgba(124,58,237,.55);animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-6px) rotate(8deg)}}
.themes{position:fixed;right:18px;bottom:80px;z-index:50;display:none;gap:8px;padding:10px;border-radius:18px;background:var(--glass);backdrop-filter:blur(20px);border:1px solid var(--border)}
.themes.on{display:flex;animation:pop .25s}
.themes i{width:34px;height:34px;border-radius:50%;cursor:pointer;border:2px solid #fff3;transition:.2s}
.themes i:hover{transform:scale(1.25) rotate(15deg)}
.stk{position:absolute;bottom:78px;left:60px;z-index:40;display:none;grid-template-columns:repeat(5,1fr);gap:4px;padding:12px;border-radius:20px;background:var(--glass);backdrop-filter:blur(22px);border:1px solid var(--border);box-shadow:var(--shadow)}
.stk.on{display:grid;animation:pop .25s}
.stk button{font-size:34px;padding:6px;border-radius:14px}
.stk button:hover{background:var(--accent-soft);transform:scale(1.3) rotate(-8deg)}
.rip{position:absolute;border-radius:50%;background:rgba(255,255,255,.35);transform:scale(0);animation:rp .6s ease-out forwards;pointer-events:none}

/* PROFILE BANNER (Premium) */

.pbanner:empty::after{content:'';position:absolute;inset:0;background:linear-gradient(120deg,transparent 30%,rgba(255,255,255,.12) 50%,transparent 70%);background-size:200% 100%;animation:pbsh 3s linear infinite}
@keyframes pbsh{from{background-position:200% 0}to{background-position:-200% 0}}

<div id="modalRoot"></div>

<script>
/* ═══════════════════════════════════════
   SALARIGRAM — Red & Black Edition
   ═══════════════════════════════════════ */
const DB_KEY='sg.db.v3', SESSION_KEY='sg.session.v3', THEME_KEY='sg.theme.v3';
const DEV_CODE='SALARI-2026';

let db={users:[],chats:[],messages:[],notifications:[],gifts:[],history:[],quests:{},settings:{}};
let meId=null, chatId=null, page='chats', replyTo=null;
let recorder=null, chunks=[], recording=false, giftCat='all';

const ROLES={
  user:{name:'Пользователь',icon:'👤',cls:'role-user'},
  junior:{name:'Мл. модер',icon:'🔧',cls:'role-junior'},
  moderator:{name:'Модер',icon:'🛡️',cls:'role-moder'},
  gl:{name:'ГЛ',icon:'🟢',cls:'role-gl'},
  admin:{name:'Админ',icon:'👑',cls:'role-admin'},
  creator:{name:'Создатель',icon:'🏆',cls:'role-creator'},
  sponsor:{name:'Спонсор',icon:'💎',cls:'role-sponsor'}
};
const PERMS=[
  ['manageChats','💬 Чаты'],['deleteMessages','🗑️ Удаление'],['banUsers','🚫 Бан'],
  ['manageStars','⭐ Звёзды'],['manageGifts','🎁 Подарки'],['manageRoles','👑 Роли'],
  ['viewHidden','👁️ Скрытое'],['notifications','🔔 Рассылка'],['developerPanel','🛠️ Dev'],['settings','⚙️ Настройки']
];

const GIFTS=[
  ['🌹','Роза',10,'common'],['🍫','Шоколад',15,'common'],['☕','Кофе',20,'common'],['🍕','Пицца',25,'common'],
  ['🍩','Пончик',30,'common'],['🧸','Мишка',35,'common'],['🎈','Шарик',40,'common'],['🌈','Радуга',50,'rare'],
  ['💎','Алмаз',75,'rare'],['👑','Корона',100,'rare'],['🚀','Ракета',120,'rare'],['🎧','Наушники',130,'rare'],
  ['🎮','Геймпад',140,'rare'],['📱','Смартфон',150,'rare'],['🛸','НЛО',180,'epic'],['⚡','Молния',200,'epic'],
  ['🔥','Огонь',220,'epic'],['🌌','Галактика',250,'epic'],['🪐','Сатурн',280,'epic'],['🐉','Дракон',300,'epic'],
  ['🦄','Единорог',350,'epic'],['🏰','Замок',400,'legendary'],['💰','Сундук',450,'legendary'],['🏆','Трофей',500,'legendary'],
  ['💫','Комета',600,'legendary'],['🌋','Вулкан',700,'legendary'],['☄️','Метеор',800,'legendary'],
  ['🌟','Золотая звезда',900,'mythic'],['👽','Инопланетянин',1000,'mythic'],['🪽','Крылья',1200,'mythic'],
  ['🔮','Артефакт',1500,'mythic'],['🌠','Звёздный дождь',1800,'mythic'],['🌙','Луна',2000,'ultra'],
  ['☀️','Солнце',2500,'ultra'],['🌍','Планета',3000,'ultra'],['🌌','Вселенная',5000,'ultra']
];

const LEVELS=[
  {level:1,title:'Новичок',xp:0},{level:2,title:'Общительный',xp:100},{level:3,title:'Звезда',xp:250},
  {level:4,title:'VIP',xp:500},{level:5,title:'Легенда',xp:1000},{level:6,title:'Мастер',xp:2500},
  {level:7,title:'Император',xp:5000},{level:8,title:'Бессмертный',xp:10000}
];

/* ─── HELPERS ─── */
const $=id=>document.getElementById(id);
const uid=p=>'id_'+Math.random().toString(36).slice(2,9)+Date.now().toString(36);
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const time=ts=>new Date(ts).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
const date=ts=>new Date(ts).toLocaleDateString('ru-RU');
const me=()=>db.users.find(u=>u.id===meId);
const getUser=id=>db.users.find(u=>u.id===id);
const getChat=id=>db.chats.find(c=>c.id===id);
const isDev=()=>{const u=me();return u&&u.role==='creator'&&u.devAccess};
const hasPerm=p=>{const u=me();return u&&(u.role==='creator'&&u.devAccess||u.permissions?.[p])};
const roleBadge=r=>`<span class="role-badge ${ROLES[r]?.cls||'role-user'}">${ROLES[r]?.icon||'👤'} ${esc(ROLES[r]?.name||'Пользователь')}</span>`;
const rarityName=r=>({common:'Обычный',rare:'Редкий',epic:'Эпик',legendary:'Легенда',mythic:'Мифик',ultra:'Ультра'}[r]||r);

function toast(t){const el=$('toast');el.textContent=t;el.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove('show'),2600)}
function save(){try{localStorage.setItem(DB_KEY,JSON.stringify(db))}catch(e){toast('Ошибка сохранения')}}
function load(){
  try{const r=localStorage.getItem(DB_KEY);if(r)db=JSON.parse(r)}catch(e){}
  ['users','chats','messages','notifications','gifts','history'].forEach(k=>{if(!Array.isArray(db[k]))db[k]=[]});
  if(!db.quests||typeof db.quests!=='object')db.quests={};
  if(!db.settings)db.settings={};
  db.users.forEach(normalize);
}
function normalize(u){
  if(!u.role)u.role='user';
  if(!u.permissions)u.permissions=defaultPerms(u.role);
  PERMS.forEach(([k])=>{if(typeof u.permissions[k]!=='boolean')u.permissions[k]=false});
  return u;
}
function defaultPerms(role){
  const p={};PERMS.forEach(([k])=>p[k]=false);
  if(role==='junior')p.deleteMessages=true;
  if(role==='moderator'){p.deleteMessages=true;p.manageChats=true;p.banUsers=true}
  if(role==='gl'){p.deleteMessages=true;p.manageChats=true;p.banUsers=true;p.notifications=true}
  if(role==='admin'||role==='creator')PERMS.forEach(([k])=>p[k]=true);
  if(role==='sponsor'){p.notifications=true;p.manageGifts=true}
  return p;
}

/* ─── MEDIA (IndexedDB) ─── */
const MEDIA_DB='SGMedia', MEDIA_STORE='files';
let mediaP=null;
function openMedia(){
  if(mediaP)return mediaP;
  mediaP=new Promise((res,rej)=>{
    const r=indexedDB.open(MEDIA_DB,1);
    r.onupgradeneeded=e=>{if(!e.target.result.objectStoreNames.contains(MEDIA_STORE))e.target.result.createObjectStore(MEDIA_STORE)};
    r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);
  });
  return mediaP;
}
async function mediaPut(id,blob){const d=await openMedia();return new Promise((res,rej)=>{const tx=d.transaction(MEDIA_STORE,'readwrite');tx.objectStore(MEDIA_STORE).put(blob,id);tx.oncomplete=()=>res(id);tx.onerror=()=>rej(tx.error)})}
async function mediaGet(id){const d=await openMedia();return new Promise((res,rej)=>{const r=d.transaction(MEDIA_STORE,'readonly').objectStore(MEDIA_STORE).get(id);r.onsuccess=()=>res(r.result||null);r.onerror=()=>rej(r.error)})}
async function mediaDel(id){if(!id)return;const d=await openMedia();return new Promise((res,rej)=>{const tx=d.transaction(MEDIA_STORE,'readwrite');tx.objectStore(MEDIA_STORE).delete(id);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}

/* ─── LEVELS / QUESTS ─── */
function getLevel(u){let r=LEVELS[0];for(const l of LEVELS)if((u.xp||0)>=l.xp)r=l;return r}
function levelNext(u){const c=getLevel(u);return LEVELS.find(x=>x.level===c.level+1)||null}
function addXP(n){const u=me();if(!u)return;const old=getLevel(u).level;u.xp=(u.xp||0)+n;if(getLevel(u).level>old){notify(u.id,'🎉 Новый уровень!',`Уровень ${getLevel(u).level}`);toast(`🎉 Уровень ${getLevel(u).level}!`)}save()}
function ensureQuests(){
  const today=new Date().toISOString().slice(0,10);
  if(db.quests.date!==today){
    db.quests={date:today,items:[
      {id:'msg',title:'Напиши 5 сообщений',icon:'💬',target:5,progress:0,reward:50,done:false},
      {id:'react',title:'Поставь 3 реакции',icon:'❤️',target:3,progress:0,reward:40,done:false},
      {id:'gift',title:'Отправь подарок',icon:'🎁',target:1,progress:0,reward:100,done:false},
      {id:'profile',title:'Открой профиль',icon:'👤',target:1,progress:0,reward:30,done:false}
    ]};save();
  }
}
function questProg(id,n=1){
  ensureQuests();const q=db.quests.items.find(x=>x.id===id);if(!q||q.done)return;
  q.progress=Math.min(q.target,q.progress+n);
  if(q.progress>=q.target){q.done=true;const u=me();if(u){u.xp=(u.xp||0)+q.reward;notify(u.id,'🏆 Задание выполнено',`${q.title} · +${q.reward} XP`);toast(`🏆 +${q.reward} XP`)}}
  save();
}

/* ─── USERS ─── */
function makeUser(name,pass){
  return {id:uid('u'),name,pass,avatarKey:null,bio:'Привет! Я в SalariGram ✦',status:'online',stars:1000,xp:0,streak:1,frame:'',title:'Новичок',role:'user',permissions:defaultPerms('user'),devAccess:false,createdAt:Date.now(),lastSeen:Date.now()};
}
function initDemo(){
  if(db.users.length)return;
  const a=makeUser('Alex','1234'),b=makeUser('Mila','1234'),c=makeUser('Denis','1234');
  a.stars=2500;b.stars=1800;c.stars=900;
  db.users.push(a,b,c);
  const c1={id:uid('c'),type:'private',members:[a.id,b.id],title:'Mila',createdAt:Date.now()};
  const c2={id:uid('c'),type:'private',members:[a.id,c.id],title:'Denis',createdAt:Date.now()};
  db.chats.push(c1,c2);
  db.messages.push(
    {id:uid('m'),chatId:c1.id,senderId:b.id,text:'Привет! 👋 Добро пожаловать в SalariGram!',createdAt:Date.now()-480000,readBy:[a.id,b.id],reactions:[]},
    {id:uid('m'),chatId:c2.id,senderId:c.id,text:'Смотри сколько тут подарков 🎁',createdAt:Date.now()-240000,readBy:[a.id,c.id],reactions:[]}
  );
  save();
}

/* ─── AUTH ─── */
let authMode='login';
function renderAuth(){
  $('authForm').innerHTML=`
    <div class="form-group"><label>Имя</label><input class="form-input" id="authName" placeholder="Alex"></div>
    <div class="form-group"><label>Пароль</label><input class="form-input" id="authPass" type="password" placeholder="••••"></div>
    <button class="btn full" onclick="submitAuth()">${authMode==='login'?'Войти':'Создать аккаунт'}</button>
    <p style="font-size:12px;color:var(--muted);margin-top:14px;text-align:center">Данные только в браузере</p>`;
}
function submitAuth(){
  const name=$('authName').value.trim(),pass=$('authPass').value;
  if(name.length<2)return toast('Введите имя');
  if(pass.length<3)return toast('Минимум 3 символа');
  if(authMode==='login'){
    const u=db.users.find(x=>x.name.toLowerCase()===name.toLowerCase()&&x.pass===pass);
    if(!u)return toast('Неверный логин или пароль');
    login(u);
  }else{
    if(db.users.some(x=>x.name.toLowerCase()===name.toLowerCase()))return toast('Имя занято');
    const u=makeUser(name,pass);db.users.push(u);save();login(u);
  }
}
function login(u){
  normalize(u);meId=u.id;localStorage.setItem(SESSION_KEY,u.id);u.lastSeen=Date.now();save();
  $('auth').classList.add('hidden');$('app').classList.remove('hidden');
  ensureQuests();setup();
}
function logout(){localStorage.removeItem(SESSION_KEY);location.reload()}
$('tabLogin').onclick=()=>{authMode='login';$('tabLogin').classList.add('active');$('tabReg').classList.remove('active');renderAuth()};
$('tabReg').onclick=()=>{authMode='register';$('tabReg').classList.add('active');$('tabLogin').classList.remove('active');renderAuth()};
renderAuth();

/* ─── CHATS ─── */
function myChats(){return db.chats.filter(c=>c.members.includes(meId))}
function other(c){return getUser(c.members.find(id=>id!==meId))}
function chatTitle(c){return c.type==='group'?(c.title||'Группа'):(other(c)?.name||'Чат')}

function renderChatList(){
  const q=($('chatSearch')?.value||'').toLowerCase();
  let list=myChats().filter(c=>chatTitle(c).toLowerCase().includes(q));
  list.sort((a,b)=>{
    const am=db.messages.filter(m=>m.chatId===a.id).at(-1)?.createdAt||0;
    const bm=db.messages.filter(m=>m.chatId===b.id).at(-1)?.createdAt||0;
    return bm-am;
  });

          ${content}

/* ─── MEDIA ─── */
async function compress(file,max=1100,q=.8){
  return new Promise((res,rej)=>{
    const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{
      const s=Math.min(1,max/Math.max(img.width,img.height));
      const c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      c.toBlob(b=>b?res(b):rej(),'image/jpeg',q);
    };img.onerror=rej;img.src=r.result};r.onerror=rej;r.readAsDataURL(file);
  });
}
async function sendImage(file){
  if(!file||!chatId)return toast('Выбери чат');
  try{
    const blob=await compress(file);const key=uid('img');await mediaPut(key,blob);
    db.messages.push({id:uid('m'),chatId,senderId:meId,type:'image',mediaKey:key,createdAt:Date.now(),readBy:[meId],reactions:[]});
    addXP(7);save();renderMessages();renderChatList();toast('🖼️ Фото отправлено');
  }catch(e){toast('Ошибка загрузки')}
}
async function loadAvatar(elId,key){
  const el=$(elId);if(!el||!key)return;
  try{const b=await mediaGet(key);if(!b)return;const url=URL.createObjectURL(b);el.innerHTML=`<img src="${url}" alt="">`}catch(e){}
}

async function toggleVoice(){
  if(recording){recorder.stop();recording=false;$('voiceBtn').textContent='🎙️';return}
  if(!navigator.mediaDevices?.getUserMedia)return toast('Микрофон не поддерживается');
  if(!chatId)return toast('Выбери чат');
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    chunks=[];recorder=new MediaRecorder(stream);
    recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
    recorder.onstop=async()=>{
      stream.getTracks().forEach(t=>t.stop());
      const blob=new Blob(chunks,{type:'audio/webm'});const key=uid('v');
      await mediaPut(key,blob);
      db.messages.push({id:uid('m'),chatId,senderId:meId,type:'voice',mediaKey:key,createdAt:Date.now(),readBy:[meId],reactions:[]});
      addXP(10);save();renderMessages();renderChatList();toast('🎙️ Отправлено');
    };
    recorder.start();recording=true;$('voiceBtn').textContent='⏹️';toast('Запись...');
  }catch(e){toast('Нет доступа к микрофону')}
}

function searchMessages(){

    <input class="form-input" id="msgSearch" placeholder="Текст сообщения..." oninput="doSearch()">

function doSearch(){
  const q=($('msgSearch').value||'').toLowerCase().trim();
  if(!q){$('searchRes').innerHTML='';return}
  const res=db.messages.filter(m=>(m.senderId===meId||getChat(m.chatId)?.members.includes(meId))&&(m.text||'').toLowerCase().includes(q));
  $('searchRes').innerHTML=res.length?res.slice(0,40).map(m=>`<div class="list-item" style="cursor:pointer" onclick="jumpMsg('${m.id}')"><strong>${esc(getUser(m.senderId)?.name||'')}</strong><div>${esc(m.text||'')}</div><div class="user-sub">${date(m.createdAt)} ${time(m.createdAt)}</div></div>`).join(''):'<div class="card">Ничего не найдено</div>';
}
function jumpMsg(id){
  const m=db.messages.find(x=>x.id===id);if(!m)return;
  chatId=m.chatId;closeModal();renderAll();
  setTimeout(()=>document.querySelector(`[data-id="${id}"]`)?.scrollIntoView({behavior:'smooth',block:'center'}),200);

function saveGroup(){

  const chat={id:uid('g'),type:'group',title,members,createdAt:Date.now()};

function devSave(){

  user.xp=Math.max(0,(user.xp||0)+a);save();renderDev();renderAll();toast(`✨ ${a>0?'+':''}${a}`);

  db.history.push({id:uid('h'),userId:user.id,type:'gift',giftId:gift.id,amount:0,createdAt:Date.now(),dev:true});
  notify(user.id,'🎁 Подарок от разработчика',`Тебе выдан ${gift.icon} ${gift.name}`);
  save();renderDev();giftAnim(gift.icon);toast(`🎁 ${gift.name}`);

function devBroadcast(){
  if(!isDev())return;
  const t=$('bcTitle').value.trim(),tx=$('bcText').value.trim();
  if(!t||!tx)return toast('Заполни поля');
  db.users.filter(u=>u.id!==meId).forEach(u=>notify(u.id,t,tx));
  save();toast('📢 Отправлено');
}
async function devDel(){
  if(!isDev())return;
  const id=$('devUser').value;if(id===meId)return toast('Нельзя удалить себя');
  const user=getUser(id);if(!user||!confirm(`Удалить ${user.name}?`))return;
  if(user.avatarKey)await mediaDel(user.avatarKey);
  db.users=db.users.filter(u=>u.id!==id);
  db.notifications=db.notifications.filter(n=>n.userId!==id);
  db.chats=db.chats.filter(c=>!c.members.includes(id));
  const valid=new Set(db.chats.map(c=>c.id));
  db.messages=db.messages.filter(m=>valid.has(m.chatId)&&m.senderId!==id);
  db.history=db.history.filter(h=>h.userId!==id&&h.to!==id);
  save();if(chatId&&!getChat(chatId))chatId=null;renderAll();renderDev();toast('🗑️ Удалён');
}
function exportDB(){
  if(!isDev())return;
  const b=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='salarigram-backup.json';a.click();
  toast('💾 Сохранено');
}
function importDB(f){
  if(!isDev()||!f)return;
  const r=new FileReader();r.onload=()=>{
    try{
      const p=JSON.parse(r.result);if(!p.users||!p.chats)throw 0;
      db=p;if(!db.gifts?.length)db.gifts=GIFTS.map((g,i)=>({id:'gift_'+i,icon:g[0],name:g[1],price:g[2],rarity:g[3]}));
      db.users.forEach(normalize);save();toast('📥 Импортировано');setTimeout(()=>location.reload(),600);
    }catch(e){toast('❌ Неверный файл')}
  };r.readAsText(f);
}
function resetDB(){
  if(!isDev()||!confirm('Сбросить всю базу?'))return;
  localStorage.removeItem(DB_KEY);localStorage.removeItem(SESSION_KEY);location.reload();
}

  if(c.bnKey)mEl(c.bnKey,c.bnType).then(h=>{const e=$('chBn');e&&(e.innerHTML=h)});
  if(c.avKey)loadAvatar('cha_big',c.avKey);c.posts.forEach(p=>p.img&&loadAvatar('chp_'+p.id,p.img))}
 window.chPostImg=async f=>{if(!f)return;try{const b=await compress(f,1100,.8),k=uid('cp');await mediaPut(k,b);if(PI)await mediaDel(PI);PI=k;toast('📎 Фото прикреплено')}catch(e){toast('Ошибка')}};
 window.chPublish=()=>{const u=me(),c=u.channel,t=$('chPT').value.trim();if(!t&&!PI)return toast('Напиши текст или прикрепи фото');
  (c.posts=c.posts||[]).push({id:uid('p'),text:t,img:PI,at:Date.now(),views:[]});PI=null;
  (c.subs||[]).forEach(id=>id!==u.id&&notify(id,'📢 '+c.name,(t||'Новое фото').slice(0,80)));save();renderAll();toast('✅ Опубликовано')};
 window.chDelPost=async id=>{const c=me().channel,p=c.posts.find(x=>x.id===id);if(p&&p.img)await mediaDel(p.img);c.posts=c.posts.filter(x=>x.id!==id);save();renderAll()};
 window.chAv=function(){const c=me().channel;
  openModal(H('🖼️ Аватар канала')+`<div style="text-align:center"><div class="avatar lg" id="cha_big" style="border-radius:26px;margin:0 auto 14px;font-size:36px">📢</div><label class="btn full" style="cursor:pointer;display:block">Загрузить фото<input id="caF" type="file" accept="image/*" hidden></label>${c.avKey?'<br><button class="btn danger full" id="caD">🗑️ Убрать</button>':''}</div>`);
  if(c.avKey)loadAvatar('cha_big',c.avKey);
  $('caF').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const b=await compress(f,500,.85),k=uid('ca');await mediaPut(k,b);if(c.avKey)await mediaDel(c.avKey);c.avKey=k;save();closeModal();renderAll();toast('✅ Аватар канала обновлён')}catch(err){toast('Ошибка')}};
  const d=$('caD');if(d)d.onclick=async()=>{await mediaDel(c.avKey);c.avKey=null;save();closeModal();renderAll()}};
 window.chBn=function(){const c=me().channel,pr=me().premium||isDev();
  openModal(H('🎞️ Баннер канала')+`<div class="pbanner" id="cbP" style="margin-bottom:12px"></div><p class="user-sub" style="margin-bottom:12px">${pr?'Фото, GIF или видео до 10 МБ — анимация сохранится.':'Фото. 💎 Анимированный баннер (GIF/видео) — только с Premium.'}</p><label class="btn full" style="cursor:pointer;display:block">Загрузить<input id="cbF" type="file" accept="${pr?'image/*,video/mp4,video/webm':'image/*'}" hidden></label>${c.bnKey?'<br><button class="btn danger full" id="cbD">🗑️ Убрать</button>':''}`);
  if(c.bnKey)mEl(c.bnKey,c.bnType).then(h=>{const e=$('cbP');e&&(e.innerHTML=h)});
  $('cbF').onchange=async e=>{const f=e.target.files[0];if(!f)return;if(!/^(image|video)\//.test(f.type))return toast('Нужно фото или видео');if(f.size>10*1024*1024)return toast('Максимум 10 МБ');
   try{let b=f,t=f.type;if(!pr){b=await compress(f,1200,.82);t='image/jpeg'}const k=uid('cb');await mediaPut(k,b);if(c.bnKey)await mediaDel(c.bnKey);c.bnKey=k;c.bnType=t;save();closeModal();renderAll();toast('✅ Баннер установлен')}catch(err){toast('Ошибка')}};
  const d=$('cbD');if(d)d.onclick=async()=>{await mediaDel(c.bnKey);c.bnKey=null;save();closeModal();renderAll()}};
 const rpx=renderProfile;window.renderProfile=renderProfile=function(){rpx();loadAvs()};
 const shx=showPage;window.showPage=showPage=function(p,b){if(p==='channels')openCh=null;shx(p,b)};
})();
</script>
</body>
